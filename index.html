<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #002D4D; /*#0a0a0a;*/
    --yellow: #FFD100;
    --white: #f5f5f0;
    --gray: #151515;
    --panel: #002D4D; /*#1a1a1a;*/
    --panel2: #222;
    --green: #30d158;
    --red: #ff3b30;
    --blue: #0a84ff;
    --orange: #ff9f0a;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--gray);
    border-bottom: 2px solid var(--yellow);
    padding: 0 16px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-left {display: flex; align-items: center; gap: 12px; }

  .line-badge {
    background: var(--yellow);
    color: var(--black);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    padding: 2px 12px;
    border-radius: 3px;
  }

  .line-name {
    font-size: 16px;
    color: var(--white); /*#666;*/
    letter-spacing: 1.5px;
    line-height: 1.8;
    text-transform: uppercase;
  }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(48,209,88,0.1);
    border: 1px solid rgba(48,209,88,0.3);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  .live-pill.offline { background: rgba(255,59,48,0.1); border-color: rgba(255,59,48,0.3); color: var(--red); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.2s infinite; }
  .offline .live-dot { background: var(--red); animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── PRÓXIMA PARADA MONITOR ── */
  .next-stop-monitor {
    background: var(--panel);
    border-bottom: 1px solid #2a2a2a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
    min-height: 64px;
    position: relative;
    overflow: hidden;
  }

  .next-stop-monitor::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--yellow);
    width: var(--progress, 0%);
    transition: width 1s linear;
  }

  .monitor-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .stop-icon-wrap {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,209,0,0.12);
    border: 2px solid var(--yellow);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    animation: stop-pulse 2s infinite;
  }
  @keyframes stop-pulse {
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,209,0,0.3); }
    50%    { box-shadow: 0 0 0 8px rgba(255,209,0,0); }
  }

  .monitor-text { min-width: 0; }
  .monitor-label { font-size: 19px; letter-spacing: 2px; color: var(--white); text-transform: uppercase; margin-bottom: 3px; }
  .monitor-stop-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--yellow);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 1px;
    transition: color 0.4s;
  }
  .monitor-stop-name.arriving { color: var(--green); animation: arrive-flash 0.6s ease 3; }
  @keyframes arrive-flash { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .monitor-right { text-align: right; flex-shrink: 0; }
  .monitor-dist { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--white); line-height: 1; }
  .monitor-dist-unit { font-size: 10px; color: #555; letter-spacing: 1px; }

  /* ── LAYOUT PRINCIPAL ── */
  .main-area { flex: 1; display: flex; overflow: hidden; position: relative; }
  #map { flex: 1; width: 100%; }
  .leaflet-tile { filter: brightness(0.65) saturate(0.4); }

  /* ── PAINEL LATERAL DE PARADAS ── */
  .stops-panel {
    width: 200px;
    background: var(--gray);
    border-left: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .stops-panel-title {
    padding: 10px 12px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .stops-list {
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .stop-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #1e1e1e;
    transition: background 0.2s;
    cursor: pointer;
  }
  .stop-item:hover { background: rgba(255,255,255,0.03); }
  .stop-item.active { background: rgba(255,209,0,0.06); }
  .stop-item.passed { opacity: 0.35; }

  .stop-line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; margin-top: 3px; }
  .stop-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid #444;
    background: #0a0a0a;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .stop-item.passed .stop-dot  { background: var(--green);  border-color: var(--green); }
  .stop-item.active .stop-dot  { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(255,209,0,0.2); }
  .stop-connector { width: 2px; flex: 1; min-height: 18px; background: #2a2a2a; margin: 2px 0; transition: background 0.3s; }
  .stop-item.passed .stop-connector { background: var(--green); }

  .stop-info { flex: 1; min-width: 0; }
  .stop-num  { font-size: 9px; color: #444; letter-spacing: 1px; margin-bottom: 1px; }
  .stop-name { font-size: 11px; color: #888; line-height: 1.3; transition: color 0.3s; }
  .stop-item.active .stop-name { color: var(--yellow); font-weight: 600; }
  .stop-item.passed .stop-name { color: #555; }
  .stop-dist-label { font-size: 9px; color: #444; margin-top: 2px; letter-spacing: 0.5px; }
  .stop-item.active .stop-dist-label { color: var(--orange); }

  /* ── BOTTOM BAR ── */
  .bottom {
    background: var(--panel);
    border-top: 1px solid #2a2a2a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
    flex-wrap: wrap;
  }

  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-label { font-size: 8px; letter-spacing: 2px; color: #555; text-transform: uppercase; }
  .info-value { font-size: 13px; color: var(--white); font-weight: 600; }
  .info-value.yellow { color: var(--yellow); }
  .info-value.green  { color: var(--green); }

  .btn-center {
    background: var(--yellow);
    color: var(--black);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 7px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn-center:hover { opacity: 0.85; }

  /* ── MARCADORES ── */
  .bus-icon-wrap {

    border-radius: 50%;

    box-shadow: 0 0 0 4px rgba(255,209,0,0.3), 0 4px 12px rgba(0,0,0,0.6);
    animation: pulse-bus 2s infinite;
  }
  @keyframes pulse-bus {
    0%,100%{ box-shadow: 0 0 0 4px rgba(255,209,0,0.3), 0 4px 12px rgba(0,0,0,0.5); }
    50%    { box-shadow: 0 0 0 10px rgba(255,209,0,0.05), 0 4px 12px rgba(0,0,0,0.5); }
  }

  .stop-marker {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid #444;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: all 0.3s;
  }
  .stop-marker.next   { border-color: var(--yellow); background: rgba(255,209,0,0.15); box-shadow: 0 0 0 4px rgba(255,209,0,0.2); }
  .stop-marker.passed { border-color: var(--green);  background: rgba(48,209,88,0.1); opacity: 0.6; }

  .leaflet-popup-content-wrapper {
    background: var(--panel) !important;
    border: 1px solid var(--yellow) !important;
    border-radius: 4px !important;
    color: var(--white) !important;
    font-family: 'IBM Plex Mono', monospace !important;
    font-size: 12px !important;
    box-shadow: 4px 4px 0 rgba(255,209,0,0.15) !important;
  }
  .leaflet-popup-tip { background: var(--panel) !important; }
  .leaflet-popup-close-button { color: #666 !important; }

  .no-signal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(10,10,10,0.92);
    border: 2px solid var(--red);
    padding: 24px 32px;
    text-align: center;
    border-radius: 4px;
    z-index: 999;
    display: none;
  }
  .no-signal h2 { font-family: 'Bebas Neue'; font-size: 26px; color: var(--red); margin-bottom: 6px; }
  .no-signal p  { font-size: 10px; color: #666; letter-spacing: 1px; }

  @media (max-width: 500px) {
    .stops-panel { display: none; }
  }
</style>
</head>

function distancia(lat1, lng1, lat2, lng2) {
  const R    = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a    = Math.sin(dLat/2)**2 +
               Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function atualizarParadas(busLat, busLng) {
  const dists = PARADAS.map((p, i) => ({
    i, dist: distancia(busLat, busLng, p.lat, p.lng)
  }));

  // Encontra a parada mais próxima a partir da última confirmada
  let melhorIdx  = proximaIdx;
  let melhorDist = dists[proximaIdx]?.dist ?? Infinity;

  for (let i = proximaIdx; i < PARADAS.length; i++) {
    if (dists[i].dist < melhorDist) {
      melhorDist = dists[i].dist;
      melhorIdx  = i;
    }
  }

  // Se chegou à parada, avança para a próxima
  if (melhorDist < CHEGADA_METROS && melhorIdx === proximaIdx && proximaIdx < PARADAS.length - 1) {
    proximaIdx = melhorIdx + 1;
    melhorIdx  = proximaIdx;
    melhorDist = dists[melhorIdx]?.dist ?? 0;
  } else {
    proximaIdx = melhorIdx;
  }

  // Atualiza visual
  PARADAS.forEach((p, i) => {
    const item   = document.getElementById(`stop-item-${i}`);
    const distEl = document.getElementById(`stop-dist-${i}`);
    const d      = Math.round(dists[i].dist);

    item.className = 'stop-item' +
      (i < proximaIdx   ? ' passed' : '') +
      (i === proximaIdx ? ' active' : '');

    /*distEl.textContent = i === proximaIdx ? `${d}m daqui`  : 
                         i < proximaIdx   ? '✓ passada'   : '';*/
                         
    distEl.textContent = i === proximaIdx ? ''  : 
                         i < proximaIdx   ? ''  : '';

    const estado = i < proximaIdx ? 'passed' : i === proximaIdx ? 'next' : '';
    stopMarkers[i].setIcon(makeStopIcon(estado));
  });

  // Scroll para item ativo
  const itemAtivo = document.getElementById(`stop-item-${proximaIdx}`);
  if (itemAtivo) itemAtivo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Monitor
  const proxParada = PARADAS[proximaIdx];
  const distProx   = Math.round(dists[proximaIdx]?.dist ?? 0);
  const chegando   = distProx < CHEGADA_METROS;

  const nomeEl       = document.getElementById('next-stop-name');
  nomeEl.textContent = proxParada ? proxParada.nome : '🏁 Terminal Final';
  nomeEl.className   = 'monitor-stop-name' + (chegando ? ' arriving' : '');

  document.getElementById('next-stop-dist').textContent = proxParada ? distProx : '—';

  // Barra de progresso entre paradas
  const distAnterior = proximaIdx > 0
    ? distancia(PARADAS[proximaIdx-1].lat, PARADAS[proximaIdx-1].lng, proxParada.lat, proxParada.lng)
    : distProx + 200;
  const progresso = Math.max(0, Math.min(100, (1 - distProx / distAnterior) * 100));
  document.getElementById('next-monitor').style.setProperty('--progress', progresso + '%');

  document.getElementById('stop-counter').textContent = `${proximaIdx + 1}/${PARADAS.length}`;
}

async function buscarLocalizacao() {
  try {
    const res   = await fetch(API_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const dados = await res.json();

    // API retorna array; pega o registro mais recente
    const d = Array.isArray(dados) ? dados[0] : dados;

    if (!d || d.latitude == null) { mostrarSemSinal(true); return; }

    mostrarSemSinal(false);
    setOnline(true);

    const lat = parseFloat(d.latitude);
    const lng = parseFloat(d.longitude);
    const horasParaSubtrair = 3;
    const ts = d.timestamp ?? Date.now();
    //const ts  = ts0 - (horasParaSubtrair * 60 * 60 * 1000);
    

    if (ts === ultimoTS) return;
    ultimoTS = ts;

    if (!busMarker) {
      busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map).bindPopup('<b>CIRCULAR</b>');
    } else {
      busMarker.setLatLng([lat, lng]);
    }

    if (centrar) map.panTo([lat, lng], { animate: true, duration: 0.8 });

    document.getElementById('last-update').textContent =
     // new Date(ts).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      new Date(ts);
    document.getElementById('accuracy').textContent = '—';

function setOnline(online) {
  const pill = document.getElementById('live-pill');
  pill.className = 'live-pill' + (online ? '' : ' offline');
  pill.innerHTML = `<div class="live-dot"></div> ${online ? 'AO VIVO' : 'SEM CONEXÃO'}`;
}

function mostrarSemSinal(show) {
  document.getElementById('no-signal').style.display = show ? 'block' : 'none';
}

function centralizar() {
  centrar = true;
  if (busMarker) map.panTo(busMarker.getLatLng(), { animate: true });
}

map.on('dragstart', () => { centrar = false; });

buscarLocalizacao();
setInterval(buscarLocalizacao, POLL_INTERVAL);
