name: Injetar Commit Hash

on:
  push:
    branches:
      - main # Altere para master se a sua branch principal tiver esse nome

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Substituir marcador pelo hash curto
        run: |
          # Extrai os 7 primeiros caracteres do commit atual
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Substitui no index.html
          sed -i "s/{{COMMIT_HASH}}/$SHORT_SHA/g" index.html

      - name: Salvar alteração no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add index.html
          git commit -m "chore: atualiza hash no html [skip ci]" || echo "Sem alterações"
          git push
