name: Injetar Commit Hash

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Substituir marcador pelo hash curto
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Substitui o conteúdo que está estritamente entre os comentários de início e fim
          sed -i "s/\(<!-- HASH_START -->\).*\(<!-- HASH_END -->\)/\1$SHORT_SHA\2/g" index.html

      - name: Salvar alteração no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add index.html
          git commit -m "chore: atualiza hash no html [skip ci]" || echo "Sem alterações"
          git push
